<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🎂 Aniversários da Família</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Cabeçalho com estatísticas -->
        <header>
            <div class="header-top">
                <h1>🎉Lista Aniversáriantes da Família Lucena e Silva</h1>
            </div>
            <p class="subtitle">Datas comemorativas de todos os membros</p>
            
            <!-- Barra de estatísticas do topo -->
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-number" id="totalPessoas">0</span>
                    <span class="stat-label">Total de membros</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="aniversariosMes">0</span>
                    <span class="stat-label">Neste Mês</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="proximoAniversario">-</span>
                    <span class="stat-label">Próximo</span>
                </div>
            </div>
        </header>

        <!-- Lista sanfona dos 12 meses (preenchida via JavaScript) -->
        <div class="month-accordion" id="monthAccordion"></div>
    </div>

    <!-- Script principal -->
    <script src="script.js"></script>
</body>
</html>
