<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🎉 Lista Aniversariantes da Família Lucena e Silva</title>

    <!-- Ícone da aba do navegador -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎉</text></svg>">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <header>
            <div class="header-top">
                <h1>🎉 Lista Aniversariantes da Família Lucena e Silva</h1>
            </div>
            <p class="subtitle">Datas comemorativas de todos os membros</p>
            
            <!-- Barra de estatísticas -->
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-number" id="totalPessoas">0</span>
                    <span class="stat-label">Total de Membros</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="aniversariosMes">0</span>
                    <span class="stat-label">Neste Mês</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="proximoAniversario">-</span>
                    <span class="stat-label">Próximo Aniversariante</span>
                </div>
            </div>
        </header>

        <!-- Contêiner onde os meses serão gerados pelo script.js -->
        <div class="month-accordion" id="monthAccordion"></div>
    </div>

    <!-- Chamada do arquivo JavaScript -->
    <script src="script.js"></script>
</body>
</html>
